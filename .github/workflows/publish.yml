name: Publish

# Publishes @delorenj/claude-notifications to npm when main is green and package.json names a
# version npm does not have yet. Release = bump the version (npm version X --no-git-tag-version),
# commit, push main. Never `npm publish` from a laptop or an agent, never an OTP.
# Auth is npm trusted publishing (OIDC); the trusted publisher on npmjs.com names THIS file
# (publish.yml), so renaming it breaks publishing. GitHub-hosted runner: the repo is public.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Is this version new?
        id: version
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$name@$version is already on npm; nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Publishing $name@$version."
          fi
      - name: npm new enough for trusted publishing (11.5.1+)
        if: steps.version.outputs.new == 'true'
        run: npm install -g npm@^11.21.0 && npm --version
      - if: steps.version.outputs.new == 'true'
        run: npm publish --provenance --access public --ignore-scripts
      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then exit 0; fi
          git tag "$tag" && git push origin "$tag"
